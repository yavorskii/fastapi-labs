services:
  db:
    image: mongo:latest
    container_name: library_mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: user
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongo_data:/data/db

  app:
    build: .
    container_name: library_api_mongo
    ports:
      - "8000:8000"
    environment:
      - MONGO_URL=mongodb://user:password@db:27017
    depends_on:
      - db

volumes:
  mongo_data: